<div id="login">
  <div class="box">
    <div class="logo">LLM<b>Launcher</b><span class="dot">.</span></div>
    <div class="sub" id="login-sub">ユーザー名とパスワードを入力してください</div>
    <div class="note hidden" id="login-note"></div>
    <div class="err hidden" id="login-err"></div>
    <form id="login-form" onsubmit="return loginSubmit(event)" autocomplete="on">
      <label class="f" for="login-user">ユーザー名</label>
      <input type="text" id="login-user" autocomplete="username" autocapitalize="none"
             spellcheck="false" required maxlength="64">
      <label class="f" for="login-pass">パスワード</label>
      <input type="password" id="login-pass" autocomplete="current-password" required maxlength="256">
      <div id="login-pw2wrap" class="hidden">
        <label class="f" for="login-pw2">パスワード (確認)</label>
        <input type="password" id="login-pw2" autocomplete="new-password" maxlength="256">
      </div>
      <label class="switch hidden" id="login-rememberwrap" style="margin-top:8px">
        <input type="checkbox" id="login-remember"><span class="track"></span>
        <span class="lab">ログイン状態を保持 (30日)</span>
      </label>
      <button class="primary" id="login-btn" type="submit">ログイン</button>
    </form>
    <div class="foot" id="login-foot"></div>
  </div>
</div>
<header>
  <button id="menu-btn" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="menu-items"><svg class=ic aria-hidden=true><use href=#i-menu /></svg></button>
  <div id="live-dot"></div>
  <h1>LLM Launcher</h1>
  <div id="acct">
    <button id="acct-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="acct-pop"
            onclick="toggleAcct(event)"><span id="acct-avatar"></span></button>
    <div id="acct-pop" class="hidden" role="dialog" aria-label="アカウント情報">
      <div class="ap-head">
        <span class="ap-av" id="ap-avatar"></span>
        <div class="ap-id">
          <div class="ap-name" id="ap-name"></div>
          <div class="ap-sub" id="ap-sub"></div>
          <div class="ap-role" id="ap-role"></div>
        </div>
      </div>
      <div class="ap-sep"></div>
      <div class="ap-kv"><span class="k">ホスト</span><span class="v" id="ap-host"></span></div>
      <div class="ap-kv"><span class="k">IP</span><span class="v mono" id="ap-ip"></span></div>
      <div class="ap-note hidden" id="ap-note"></div>
      <div class="ap-sep hidden" id="ap-menu-sep"></div>
      <button class="ap-act hidden" id="ap-users" type="button"
              onclick="closeAcct();switchTab('users')"><svg class=ic aria-hidden=true><use href=#i-users /></svg> ユーザー管理</button>
      <div class="ap-sep hidden" id="ap-logout-sep"></div>
      <button class="ap-act" id="ap-logout" type="button"
              onclick="closeAcct();logout()"><svg class=ic aria-hidden=true><use href=#i-logout /></svg> ログアウト</button>
    </div>
  </div>
</header>

<main>
  <!-- 各 view の HTML は js/views/*.js の VIEWS.<tab> (起動時差し込み) -->
</main>

<nav id="sidemen" aria-label="メインメニュー">
  <div class="menu-head">
    <span class="menu-title">メニュー</span>
    <button id="menu-close" type="button" aria-label="メニューを閉じる"><svg class=ic aria-hidden=true><use href=#i-close /></svg></button>
  </div>
  <div class="menu-items" id="menu-items">
    <button class="mitem on" data-tab="home" id="mi-home"><span class="ico"><svg class=ic aria-hidden=true><use href=#i-home /></svg></span>ホーム</button>
